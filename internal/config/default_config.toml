# ═══════════════════════════════════════════════════════════════
# CodeActor 默认配置模板
# 首次运行自动生成，编辑此文件后生效
# 完整配置说明：https://github.com/codeactor/codeactor
# ═══════════════════════════════════════════════════════════════

# ── 全局 LLM ──
[global.llm]
use_provider = "deepseek_v4_pro"

[global.llm.providers.aliyun]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

[global.llm.providers.deepseek_v4_pro]
model = "deepseek-v4-pro"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"
reasoning_effort = "max"

[global.llm.providers.local]
model = "Qwen3-30B-A3B"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "dummy-key"

# ── Agent 级 LLM（优先级: agent > agents > global）──
[agents.llm.director]
use_provider = "deepseek_v4_pro"

[agents.llm.coding]
use_provider = "local"

[agents.llm.repo]
use_provider = "local"

[agents.llm.browser]
use_provider = "local"

[agents.llm.chat]
use_provider = "local"

[agents.llm.meta]
use_provider = "local"

[agents.llm.devops]
use_provider = "local"

# ── 工具级 LLM（优先级: tool > tools > agent > global）──
[tools.llm.thinking]
use_provider = "deepseek_v4_pro"

[tools.llm.deepthinking]
use_provider = "deepseek_v4_pro"

# ── 应用设置 ──
[app]
enable_streaming = true

# ── 代码库（语义搜索）──
[codexray]
enable_embedding = true

[codexray.embedding]
model = "Qwen/Qwen3-Embedding-4B"
api_token = "your-key"
api_base_url = "https://api.siliconflow.cn/v1"
dimensions = 2560

# ── 检索管线（多阶段级联检索，默认启用）──
[codexray.retrieval_pipeline]
enabled = true

[codexray.retrieval_pipeline.reranker]
enabled = false
api_token = "your-key"
model = "BAAI/bge-reranker-v2-m3"
api_base_url = "https://api.siliconflow.cn"

# ── 增强型 Commander（分布式认知架构）──
# 所有选项默认关闭，启用时需显式设置
# [enhanced_commander]
# enable = false
# enable_result_compression = false
# compression_threshold = 4096
# summary_max_length = 2048
# max_delegation_depth = 3

# ── Git Checkpoint 机制 ──
# 在 Agent 执行期间自动创建代码快照，支持回滚和最终 squash merge
[git_checkpoint]
enabled = true
# DEPRECATED: auto_checkpoint is no longer used.
# Checkpoints are now created by the agent via git_checkpoint_create tool
# when it determines a meaningful milestone has been reached.
auto_checkpoint = false
# DEPRECATED: checkpoint_interval is no longer used.
# The agent decides when to create checkpoints based on task context.
checkpoint_interval = 0
max_checkpoints = 50                     # 最大保留的 checkpoint 数量
squash_on_exit = true                    # Agent 退出时 squash 合并到主分支
generate_commit_message = true           # 使用 LLM 生成 commit 消息
agent_branch_prefix = "agent/coding"     # agent 工作分支前缀
checkpoint_tag_prefix = "checkpoint/coding"  # checkpoint 标签前缀
stash_dirty_worktree = true              # 启动时 stash 未提交的变更
cleanup_agent_branch = true              # 退出时清理 agent 分支
cleanup_checkpoint_tags = true           # 退出时清理 checkpoint 标签

# ═══════════════════════════════════════════════════════════════
# 上下文压缩配置（三层防御的第一层：TOML 配置层）
# ═══════════════════════════════════════════════════════════════
# 如果此段完全缺失，应用层（compact_config.go）会通过 applySafeDefaults()
# 兜底所有字段的默认值。建议显式配置以下字段：
[context]
enable_auto_compact = true            # 是否自动触发压缩（默认 true）
max_context_tokens = 198000           # 最大上下文 token 数
summarization_model = ""              # 轻量摘要模型（空=复用主引擎）
summarization_provider = ""           # 独立摘要 provider（空=复用主引擎）
summarization_timeout = 120           # 摘要超时（秒）
summarization_max_input_tokens = 120000 # 单批次最大输入 token 数
summarization_prompt = ""             # 自定义摘要提示词（空=使用默认）
keep_recent_rounds = 2                # 始终保留的最近对话轮数
