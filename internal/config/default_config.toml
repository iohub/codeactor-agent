# ═══════════════════════════════════════════════════════════════
# CodeActor 默认配置模板
# 首次运行自动生成，编辑此文件后生效
# 完整配置说明：https://github.com/codeactor/codeactor
# ═══════════════════════════════════════════════════════════════

# ── 全局 LLM ──
[global.llm]
use_provider = "deepseek_v4_pro"

[global.llm.providers.aliyun]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

[global.llm.providers.deepseek_v4_pro]
model = "deepseek-v4-pro"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"
reasoning_effort = "max"

[global.llm.providers.local]
model = "Qwen3-30B-A3B"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "dummy-key"

# ── Agent 级 LLM（优先级: agent > agents > global）──
[agents.llm.conductor]
use_provider = "deepseek_v4_pro"

[agents.llm.coding]
use_provider = "local"

[agents.llm.repo]
use_provider = "local"

[agents.llm.browser]
use_provider = "local"

[agents.llm.chat]
use_provider = "local"

[agents.llm.meta]
use_provider = "local"

[agents.llm.devops]
use_provider = "local"

# ── 工具级 LLM（优先级: tool > tools > agent > global）──
[tools.llm.thinking]
use_provider = "deepseek_v4_pro"

[tools.llm.deepthinking]
use_provider = "deepseek_v4_pro"

# ── 应用设置 ──
[app]
enable_streaming = true

# ── 代码库（语义搜索）──
[codebase]
enable_embedding = true

[codebase.embedding]
model = "Qwen/Qwen3-Embedding-4B"
api_token = "your-key"
api_base_url = "https://api.siliconflow.cn/v1"
dimensions = 2560

# ── 检索管线（多阶段级联检索，默认启用）──
[codebase.retrieval_pipeline]
enabled = true

[codebase.retrieval_pipeline.reranker]
enabled = false
api_token = "your-key"
model = "BAAI/bge-reranker-v2-m3"
api_base_url = "https://api.siliconflow.cn"
