<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="CodeActor - AI coding assistant for VSCode"
    />
    <title>CodeActor</title>
    <style>
      /* VSCode 主题变量 */
      :root {
        --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        --font-size: 13px;
        --editor-font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        --editor-background: #1e1e1e;
        --editor-foreground: #d4d4d4;
        --sideBar-background: #252526;
        --sideBar-foreground: #cccccc;
        --editorWidget-background: #2d2d30;
        --widget-border: #3e3e42;
        --button-background: #0e639c;
        --button-hoverBackground: #1177bb;
        --descriptionForeground: #858585;
      }

      .vscode-light {
        --editor-background: #ffffff;
        --editor-foreground: #333333;
        --sideBar-background: #f6f6f6;
        --sideBar-foreground: #333333;
        --editorWidget-background: #e8e8e8;
        --widget-border: #e1e1e1;
        --button-background: #006ab1;
        --button-hoverBackground: #007acc;
        --descriptionForeground: #666666;
      }

      body {
        margin: 0;
        padding: 0;
        font-family: var(--font-family);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-color: var(--editor-background);
        color: var(--editor-foreground);
        font-size: var(--font-size);
        overflow: hidden;
        box-sizing: border-box;
      }
      
      *, *::before, *::after {
        box-sizing: inherit;
      }

      code {
        font-family: var(--editor-font-family);
      }

      #root {
        height: 100vh;
        width: 100%;
      }

      /* 加载动画 */
      .loading {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        font-size: 14px;
        color: var(--descriptionForeground);
      }

      .loading::after {
        content: '';
        width: 20px;
        height: 20px;
        border: 2px solid var(--descriptionForeground);
        border-top: 2px solid var(--button-background);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: 10px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="loading">Loading CodeActor...</div>
    </div>
    <script>
      // 检测是否在VSCode环境中运行
      if (!window.vscode) {
        console.log('CodeActor Web Preview Mode - Running in browser');
        // 在浏览器环境中添加提示
        window.addEventListener('DOMContentLoaded', function() {
          const style = document.createElement('style');
          style.textContent = `
            .browser-preview-notice {
              position: fixed;
              top: 10px;
              right: 10px;
              background: rgba(255, 193, 7, 0.9);
              color: #333;
              padding: 8px 12px;
              border-radius: 4px;
              font-size: 12px;
              z-index: 1000;
              font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            }
          `;
          document.head.appendChild(style);
          
          const notice = document.createElement('div');
          notice.className = 'browser-preview-notice';
          
          // 5秒后淡出
          setTimeout(() => {
            notice.style.opacity = '0.7';
            notice.style.transition = 'opacity 0.5s';
          }, 5000);
        });
      }
    </script>
  </body>
</html>
