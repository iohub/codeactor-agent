# ── 三级LLM配置（优先级: tools.llm > agents.llm > global.llm）──

# 全局默认LLM提供商
[global.llm]
use_provider = "aliyun"

# Agent级LLM配置：可为所有agent设置默认值，也可按agent名单独指定
[agents.llm]
# use_provider = "openrouter"  # 所有agent的默认提供商（可选）

# 按agent名指定（优先级高于 agents.llm.use_provider）
# [agents.llm.conductor]
# use_provider = "aliyun"
# [agents.llm.coding]
# use_provider = "deepseek"
# [agents.llm.repo]
# use_provider = "siliconflow"
# [agents.llm.chat]
# use_provider = "xiaomi"
# [agents.llm.meta]
# use_provider = "openrouter"
# [agents.llm.devops]
# use_provider = "local"

# Tool级LLM配置：可为需要LLM调用的tool指定专用提供商
[tools.llm]
# use_provider = "siliconflow"  # 所有tool的默认提供商（可选）

# 按tool名指定（优先级高于 tools.llm.use_provider）
# [tools.llm.micro_agent]
# use_provider = "local"
# [tools.llm.thinking]
# use_provider = "xiaomi"

# ── LLM提供商定义（所有层级共用）──
[global.llm.providers.xiaomi]
model = "mimo-v2-flash"
temperature = 0.3
max_tokens = 28000
api_base_url = "https://api.xiaomimimo.com/v1"
api_key = "your-key"

# 阿里云配置
[global.llm.providers.aliyun]
# model = "qwen3-max-preview"
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

# SiliconFlow配置
[global.llm.providers.siliconflow]
model = "deepseek-ai/DeepSeek-V3.2"
temperature = 0.0
max_tokens = 23000
api_base_url = "https://api.siliconflow.cn/v1"
api_key = "your-key"

# StreamLake配置
[global.llm.providers.streamlake]
# model = "KAT-Coder-Air-V1"
model = "ep-w1klde-1767706500222997285"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://wanqing.streamlakeapi.com/api/gateway/v1/endpoints"
api_key = "your-key"

# OpenRouter配置
[global.llm.providers.openrouter]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://openrouter.ai/api/v1"
api_key = "your-key"

# 本地配置
[global.llm.providers.local]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "your-key"

# 其他模型配置示例
[global.llm.providers.moonshot]
model = "moonshotai/Kimi-K2-Instruct"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.moonshot.cn/v1"
api_key = "your-key"

[global.llm.providers.deepseek]
model = "deepseek-ai/DeepSeek-V3"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"

[global.llm.providers.zai]
model = "zai-org/GLM-4.5-Air"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.zai.org/v1"
api_key = "your-key"

[global.llm.providers.mistral]
model = "mistralai/devstral-small"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.mistral.ai/v1"
api_key = "your-key"

# AWS Bedrock 配置
[global.llm.providers.bedrock]
model = "us.anthropic.claude-3-7-sonnet-20250219-v1:0"
temperature = 0.0
max_tokens = 3000
aws_region = "us-east-1"
# aws_profile = "default"  # 可选：使用特定的AWS profile
# model_provider = "anthropic"  # 可选：显式指定模型提供商（自动检测）

# Bedrock Nova 模型示例
[global.llm.providers.bedrock-nova]
model = "us.amazon.nova-lite-v1:0"
temperature = 0.0
max_tokens = 3000
aws_region = "us-east-1"

# Bedrock Meta 模型示例
[global.llm.providers.bedrock-meta]
model = "us.meta.llama3-1-405b-instruct-v1:0"
temperature = 0.0
max_tokens = 3000
aws_region = "us-east-1"

[app]
enable_streaming = true

[agent]
conductor_max_steps = 30
coding_max_steps = 50
repo_max_steps = 30
meta_retry_count = 5
lang = "Chinese"

# ═══════════════════════════════════════════════════════════
# Context Compact Configuration
# 上下文压缩配置（仅使用 LLM 摘要压缩）
# ═══════════════════════════════════════════════════════════
[context]
# 最大上下文token数，默认198000 (198k)
max_context_tokens = 198000

# 是否自动触发压缩
enable_auto_compact = true

# 用于摘要的轻量模型 (可选，不配置则跳过L1)
# summarization_model = "gpt-3.5-turbo"

# 用于摘要的provider（可选，指向 [global.llm.providers] 中定义的 provider name）
# 不配置则复用主 agent 的 LLM 引擎
# summarization_provider = "siliconflow"

# 摘要超时时间（秒）
summarization_timeout = 15

# 摘要时单批次最大输入token数
summarization_max_input_tokens = 8000

# 始终保留的最近对话轮数（用于优先级计算）
keep_recent_rounds = 3

# Codebase Component Configuration
[codebase]
enable_embedding = true

[codebase.embedding]
model = "Qwen/Qwen3-Embedding-4B"
api_token = "your-key"
api_base_url = "https://api.siliconflow.cn/v1"
dimensions = 2560

# ─────────────────────────────────────────────────────────────
# Browser Configuration (go-rod headless Chrome)
# ─────────────────────────────────────────────────────────────
[browser]
headless = true
browser_path = "/bin/google-chrome"
user_data_dir = ""
viewport_width = 1280
viewport_height = 720
allowed_domains = []
blocked_domains = []
timeout_seconds = 30
max_concurrent_pages = 4
auto_launch = true
idle_timeout = "5m"
allow_no_sandbox = false   # Docker 环境设为 true
extra_args = []
enable_browser_agent = true
task_timeout_seconds = 300

# ─────────────────────────────────────────────────────────────
# Commit Learner Configuration
# ─────────────────────────────────────────────────────────────
[commit_learner]
enabled = true
max_commits = 30
similarity_threshold = 0.75
top_k = 3
trigger = "both"
cache_ttl = 3600

# 专用的 LLM provider 名称（可选）
# 配置后，commit 总结和信息提取将使用此 provider 的模型
# 不配置则使用全局默认 LLM (global.llm.use_provider)
summarization_provider = ""

# 自定义 LLM 系统提示词（可选，不配置使用默认值）
# llm_system_prompt = """
# You are a software engineering analyst. Analyze the following git commit and provide a structured summary.
# Output in JSON format with these fields:
# - requirement: A brief description of what requirement this commit addresses
# - files: List of changed files with brief description of changes
# - approach: The technical approach or strategy used
# - implementation: Key implementation details
# Keep each field concise (2-3 sentences max).
# """

# ═══════════════════════════════════════════════════════════
# Keywords Dictionary Configuration
# 关键词词典配置
# ═══════════════════════════════════════════════════════════
[keywords]
default_path = "~/.codeactor/keywords.txt"
hot_reload = false

# 自动补全词典（使用默认路径和项目级文件）
# 如果 [[dict]] 留空 Files，将自动使用 default_path 和项目级文件

# 白名单词典（精确匹配，用于允许的内容）
# [[dict]]
# name = "whitelist"
# files = [".codeactor/whitelist.txt"]
# type = "exact"
# builtin_type = "none"

# 黑名单词典（精确匹配，用于禁止的内容）
# [[dict]]
# name = "blacklist"
# files = [".codeactor/blacklist.txt"]
# type = "exact"
# builtin_type = "none"