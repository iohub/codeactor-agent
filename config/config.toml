# ═══════════════════════════════════════════════════════════════
# CodeActor 配置文件
# 使用方式：复制到 ~/.codeactor/config/config.toml 后修改
# 完整配置说明：https://github.com/codeactor/codeactor
# ═══════════════════════════════════════════════════════════════

# ── 全局 LLM ──
[global.llm]
use_provider = "aliyun"

# ── LLM 提供商（仅 3 个必要示例）──
[global.llm.providers.aliyun]
model = "qwen3-coder-plus"
temperature = 0.0
max_tokens = 28000
api_base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key = "your-key"

# 故障转移配置示例（取消注释以启用）:
# fallback_providers = [
#     { provider = "deepseek_v4_pro" },  # weight 可选，默认按书写顺序
#     { provider = "local" },
# ]

[global.llm.providers.deepseek_v4_pro]
model = "deepseek-v4-pro"
temperature = 0.0
max_tokens = 3000
api_base_url = "https://api.deepseek.com/v1"
api_key = "your-key"
reasoning_effort = "max"

[global.llm.providers.local]
model = "qwen3-30b-a3b"
temperature = 0.0
max_tokens = 3000
api_base_url = "http://127.0.0.1:8000"
api_key = "dummy-key"

# ── Agent 级 LLM（优先级: agent > agents > global）──
[agents.llm.director]
use_provider = "deepseek_v4_pro"

[agents.llm.coding]
use_provider = "local"

[agents.llm.repo]
use_provider = "local"

[agents.llm.browser]
use_provider = "local"

[agents.llm.chat]
use_provider = "local"

[agents.llm.meta]
use_provider = "local"

[agents.llm.devops]
use_provider = "local"

# ── 工具级 LLM（优先级: tool > tools > agent > global）──
[tools.llm.thinking]
use_provider = "deepseek_v4_pro"

[tools.llm.deepthinking]
use_provider = "deepseek_v4_pro"

# ── 应用设置 ──
[app]
enable_streaming = true

# ── 代码库（语义搜索）──
[codexray]
enable_embedding = true

[codexray.embedding]
model = "Qwen/Qwen3-Embedding-4B"
api_token = "your-key"
api_base_url = "https://api.siliconflow.cn/v1"
dimensions = 2560

# ── 检索管线（多阶段级联检索，默认启用）──
[codexray.retrieval_pipeline]
enabled = true

[codexray.retrieval_pipeline.reranker]
enabled = false
api_token = "your-key"
model = "Qwen/Qwen3-Reranker-4B"
api_base_url = "https://api.siliconflow.cn/v1/rerank"

# ── CodeSeek MCP 代码分析引擎配置 ──
[codeseek]
# codeseek 二进制文件路径（空=不启用 MCP，使用 HTTP codexray 作为后备）
binary_path = ""
# MCP 启动参数
mcp_args = ["serve", "--mcp"]
# 请求超时秒数
request_timeout = 30

# ═══════════════════════════════════════════════════════════════
# Phase 1 Stage 1.0: 新增配置段落
# ═══════════════════════════════════════════════════════════════

# ── 消息总线配置 ──
[messaging]
enabled = true
queue_size = 256
publish_timeout = "5s"
dispatch_timeout = "3s"
max_retries = 3
enable_dlq = true
dlq_size = 1000
enable_metrics = true
backpressure_mode = "block"  # "block" = 新行为（阻塞+重试+DLQ）, "drop" = 向后兼容旧行为（静默丢弃）

# ── codexray 分析引擎配置 ──
[codexray.client]
enabled = true
base_url = ""
timeout = "30s"
max_retries = 3
retry_interval = "500ms"
enable_circuit_breaker = true
cb_failure_threshold = 5
cb_reset_timeout = "30s"
enable_cache = true
cache_ttl = "30m"
cache_max_entries = 100
enable_fallback = true

# ── Director 配置 ──
[director]
enable_checkpoint = true
checkpoint_path = ""
checkpoint_interval = "30s"
sync_on_critical = true

# ── 工具注册配置（Phase 2 使用）──
[tools_registry]
enable_registry = false

# ── Agent 直接通信配置（Phase 2 使用）──
[agent_comm]
enable_direct = false

# ═══════════════════════════════════════════════════════════════
# 上下文压缩配置（三层防御的第一层：TOML 配置层）
# ═══════════════════════════════════════════════════════════════
# 如果此段完全缺失，应用层（compact_config.go）会通过 applySafeDefaults()
# 兜底所有字段的默认值。建议显式配置以下字段：
[context]
enable_auto_compact = true            # 是否自动触发压缩（默认 true）
max_context_tokens = 198000           # 最大上下文 token 数
summarization_model = ""              # 轻量摘要模型（空=复用主引擎）
summarization_provider = ""           # 独立摘要 provider（空=复用主引擎）
summarization_timeout = 120           # 摘要超时（秒）
summarization_max_input_tokens = 120000 # 单批次最大输入 token 数
summarization_prompt = ""             # 自定义摘要提示词（空=使用默认）
keep_recent_rounds = 2                # 始终保留的最近对话轮数

# ═══════════════════════════════════════════════════════════════
# TUI Keybindings Configuration
# ── 可配置 TUI 快捷键 ──
# 未配置的项使用 Go 代码中的默认值。
# 格式：使用 Bubble Tea 按键事件格式（小写）：
#   - 修饰键: "ctrl+e", "alt+s", "alt+enter"
#   - 单键:   "j", "k", "f", "b", "i", "?"
#   - 特殊键: "enter", "esc", "tab", "space"

[tui]
  [tui.keybindings]
    
    [tui.keybindings.edit]
    submit_task     = "alt+s"      # 提交任务
    command_mode    = "ctrl+e"     # 进入命令模式
    toggle_help     = "ctrl+h"     # 切换帮助
    toggle_timeline = "ctrl+l"     # 切换全屏时间线
    page_down       = "ctrl+f"     # 向下翻页
    page_up         = "ctrl+b"     # 向上翻页
    quit            = "ctrl+c"     # 退出
    switch_model    = "alt+m"      # 切换模型
    
    [tui.keybindings.command]
    scroll_down       = "j"        # 向下滚动一行
    scroll_up         = "k"        # 向上滚动一行
    page_down         = "f"        # 向下翻页
    page_up           = "b"        # 向上翻页
    edit_mode         = "i"        # 进入编辑模式
    toggle_help       = "?"        # 显示帮助
    toggle_token_panel = "alt+t"   # 切换 Token 面板
    switch_model      = "alt+m"    # 切换模型
    quit              = "ctrl+c"   # 退出

# ── LLM 故障转移配置 ──
[llm]
# enable_fallback = true       # 启用provider级故障转移
# fallback_max_retries = 2     # fallback provider的内部重试次数
